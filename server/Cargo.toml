[package]
name = "simbridge-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["SimBridge Contributors"]
description = "SimBridge Server - central server for simulator control"
license = "MIT"
repository = "https://github.com/yourusername/simbridge"

[[bin]]
name = "simbridge-server"
path = "src/main.rs"

[dependencies]
simbridge-shared = { path = "../shared" }
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
config = "0.14"
async-trait = "0.1"
rustls = "0.23"
rustls-pemfile = "2.0"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"
