name: simbridge_companion
description: SimBridge Companion App - control simulators from your phone
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  web_socket_channel: ^2.4.0
  http: ^1.1.0
  uuid: ^4.0.0
  geolocator: 14.0.3
  permission_handler: 13.0.1
  fluttertoast: 10.0.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  image_picker: ^1.0.0
  clipboard: ^0.1.3
  sensors_plus: 7.1.0
  flutter_webrtc: 1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
