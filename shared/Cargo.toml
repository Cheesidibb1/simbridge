[package]
name = "simbridge-shared"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["SimBridge Contributors"]
description = "Shared core library for SimBridge"
license = "MIT"
repository = "https://github.com/yourusername/simbridge"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
base64 = "0.21"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"
pbkdf2 = "0.12"
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"

[[bench]]
name = "serialization"
harness = false
